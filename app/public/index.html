<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нотатки — UDC WS8</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Нотатки</h1>
      <label>
        Я увійшов як
        <select id="user">
          <option value="1">Оля</option>
          <option value="2">Тарас</option>
        </select>
      </label>
    </header>

    <form id="new-note">
      <label class="field">
        Заголовок
        <input id="title" name="title" autocomplete="off" required />
      </label>
      <label class="field">
        Текст
        <input id="body" name="body" autocomplete="off" />
      </label>
      <button type="submit">Додати</button>
    </form>

    <div id="filters" role="tablist" aria-label="Список нотаток">
      <button type="button" role="tab" id="filter-active" aria-selected="true" aria-controls="notes-panel">
        Активні
      </button>
      <button type="button" role="tab" id="filter-archived" aria-selected="false" aria-controls="notes-panel">
        Архів
      </button>
    </div>

    <div id="notes-panel" role="tabpanel" aria-labelledby="filter-active">
      <ul id="notes"></ul>
      <p id="empty" hidden>Активних нотаток немає.</p>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
